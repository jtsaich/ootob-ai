<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>旅遊網站 Demo 作品集｜ootob.ai</title>
  <meta name="description" content="ootob.ai 旅遊網站設計 demo 作品集。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17171a;--mute:#6b6b73;--line:#e2e1dc;--bg:#f7f6f2}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:15px;line-height:1.75}
    a{color:inherit;text-decoration:none}
    img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
    .wrap{width:min(1100px,calc(100% - 48px));margin:auto;padding:72px 0 96px}
    .kicker{margin:0 0 14px;color:var(--mute);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 48px;font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.2;letter-spacing:-.02em}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .card{display:flex;flex-direction:column;border:1px solid var(--line);background:#fff;overflow:hidden;transition:transform .25s,box-shadow .25s}
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
    .thumb{aspect-ratio:3/2;overflow:hidden;border-bottom:1px solid var(--line);background:#eee}
    .thumb img{transition:transform .6s}
    .card:hover .thumb img{transform:scale(1.03)}
    .body{padding:18px 22px 22px}
    .body h2{margin:0;font-size:17px;font-weight:700}
    .body p{margin:6px 0 0;color:var(--mute);font-size:13px}
    .cta{display:block;margin-top:14px;font-size:13px;font-weight:500}
    .cta::after{content:" →"}
    .note{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
    @media(max-width:860px){.grid{grid-template-columns:1fr}.wrap{padding-top:48px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">ootob.ai · Portfolio</p>
    <h1>旅遊網站 Demo 作品集</h1>
    <div class="grid">
      <a class="card" href="/demo/travel-editorial/">
        <div class="thumb"><img src="assets/travel-editorial.webp" alt="山眠旅造網站首屏截圖" loading="eager"></div>
        <div class="body"><h2>山眠旅造</h2><p>編輯刊物風格 · 慢旅品牌</p><span class="cta">打開網站</span></div>
      </a>
      <a class="card" href="/demo/travel-expedition/">
        <div class="thumb"><img src="assets/travel-expedition.webp" alt="POLARIS 極北探路網站首屏截圖" loading="lazy"></div>
        <div class="body"><h2>POLARIS 極北探路</h2><p>高端探險風格 · 極地遠征</p><span class="cta">打開網站</span></div>
      </a>
      <a class="card" href="/demo/travel-island/">
        <div class="thumb"><img src="assets/travel-island.webp" alt="跳島計畫網站首屏截圖" loading="lazy"></div>
        <div class="body"><h2>跳島計畫</h2><p>活潑海島風格 · 短天數輕旅行</p><span class="cta">打開網站</span></div>
      </a>
    </div>
    <p class="note">以上為設計 demo，非實際旅行社；品牌、行程與價格均為示意。示意影像來源：Unsplash。</p>
  </main>
</body>
</html>
