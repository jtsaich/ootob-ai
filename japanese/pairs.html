<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対義語 · 日本語形容詞對立詞</title>

<style>
  :root {
    --bg: #fafaf8;
    --surface: #fff;
    --card: #f0eeea;
    --accent: #1a1a1a;
    --accent2: #555;
    --text: #1a1a1a;
    --text-muted: #555;
    --a-color: #1565c0;
    --b-color: #c62828;
    --border: #e0ddd8;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; width: 100%; padding: 20px; }
  header { text-align: center; padding: 30px 0 16px; }
  header h1 { font-size: 1.6em; margin-bottom: 6px; text-wrap: balance; }
  header .subtitle { color: var(--text-muted); font-size: 0.9em; }
  header .back {
    display: inline-block;
    margin-top: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.8em;
  }
  header .back:hover { color: var(--text); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .toolbar-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.8em;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background-color 0.2s;
  }
  .chip.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--card);
  }
  .toolbar-actions { display: flex; gap: 8px; align-items: center; }
  .action-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 0.85em;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
  }
  .action-btn.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .action-btn:hover { border-color: var(--accent); }
  .toggle-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    font-size: 0.8em;
    color: var(--text-muted);
  }
  .toggle-row label { cursor: pointer; user-select: none; }
  .toggle-row input { margin-right: 4px; vertical-align: middle; }

  .pair-list { display: flex; flex-direction: column; gap: 16px; }
  .pair-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .pair-card.spotlight {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .pair-card .cat-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.7em;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--card);
    color: var(--text-muted);
  }
  .pair-card .level-tag {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.7em;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--card);
    color: var(--text-muted);
  }

  .pair-words {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin: 24px 0 16px;
  }
  .word { text-align: center; }
  .word .kanji {
    font-size: 1.8em;
    font-weight: 700;
    line-height: 1.2;
  }
  .word ruby rt {
    font-size: 0.45em;
    color: var(--text-muted);
    font-weight: 400;
  }
  .word .zh {
    font-size: 0.85em;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .word.a .kanji { color: var(--a-color); }
  .word.b .kanji { color: var(--b-color); }
  .vs {
    font-family: 'Inter', sans-serif;
    font-size: 0.7em;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  .examples {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .example {
    background: var(--surface);
    padding: 14px;
    font-size: 0.95em;
    line-height: 1.5;
  }
  .example.a { border-left: 3px solid var(--a-color); }
  .example.b { border-left: 3px solid var(--b-color); }
  .example .ja {
    font-weight: 500;
    margin-bottom: 6px;
  }
  .example .ja ruby rt {
    font-size: 0.55em;
    color: var(--text-muted);
    font-weight: 400;
  }
  .example .zh {
    font-size: 0.8em;
    color: var(--text-muted);
  }

  body.hide-zh .word .zh,
  body.hide-zh .example .zh { visibility: hidden; }
  body.hide-ja .word .kanji,
  body.hide-ja .example .ja { visibility: hidden; }
  body.hide-zh .word .zh:hover,
  body.hide-zh .example .zh:hover,
  body.hide-ja .word .kanji:hover,
  body.hide-ja .example .ja:hover { visibility: visible; }

  .spotlight-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,26,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .spotlight-overlay.show { display: flex; }
  .spotlight-overlay .pair-card {
    max-width: 600px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .spotlight-close {
    position: absolute;
    top: -36px;
    right: 0;
    background: transparent;
    border: none;
    color: white;
    font-size: 1.2em;
    cursor: pointer;
    padding: 4px 8px;
  }

  .count-bar {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8em;
    margin-bottom: 16px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  #filePicker {
    text-align:center;
    margin: 20px 0;
    padding: 20px;
    background: var(--card);
    border-radius: var(--radius);
  }

  @media (max-width: 540px) {
    .pair-words { grid-template-columns: 1fr; gap: 8px; }
    .vs { justify-self: center; }
    .examples { grid-template-columns: 1fr; }
    .example.a { border-left: none; border-top: 3px solid var(--a-color); }
    .example.b { border-left: none; border-top: 3px solid var(--b-color); }
    .word .kanji { font-size: 1.5em; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>対義語</h1>
    <div class="subtitle">形容詞對立詞 · 對照例句</div>
    <a href="quiz.html" class="back">← 回 Dojo</a>
  </header>

  <div class="toolbar">
    <div class="toolbar-group" id="catFilter">
      <button class="chip active" data-cat="all">全部</button>
    </div>
    <div class="toolbar-group">
      <button class="chip active" data-level="all" onclick="setLevel('all')">N5+N4</button>
      <button class="chip" data-level="N5" onclick="setLevel('N5')">N5</button>
      <button class="chip" data-level="N4" onclick="setLevel('N4')">N4</button>
    </div>
    <div class="toolbar-actions">
      <button class="action-btn primary" onclick="randomSpotlight()">隨機抽一組</button>
    </div>
    <div class="toggle-row">
      <label><input type="checkbox" id="hideZh" onchange="toggleHide()"> 隱藏中文</label>
      <label><input type="checkbox" id="hideJa" onchange="toggleHide()"> 隱藏日文</label>
    </div>
  </div>

  <div id="filePicker" style="display:none;">
    <p style="color:var(--text-muted); font-size:0.85em; margin-bottom:12px;">
      直接開檔無法自動載入 .md，請選擇檔案，或用 local server 開啟：<br>
      <code style="color:var(--text); font-size:0.8em; background:var(--surface); padding:2px 6px; border-radius:4px;">python3 -m http.server 8000</code>
    </p>
    <label style="padding:8px 16px; border:1px solid var(--border); border-radius:8px; cursor:pointer; color:var(--text-muted); font-size:0.85em; background:var(--surface);">
      adjective-pairs.md
      <input type="file" id="pairsFile" accept=".md" style="display:none" onchange="handleFileSelect()">
    </label>
  </div>

  <div class="count-bar" id="countBar"></div>

  <div class="pair-list" id="pairList"></div>

  <div class="empty" id="empty" style="display:none;">沒有符合條件的組合</div>

  <footer style="text-align:center; margin-top:40px; padding-top:16px; border-top:1px solid var(--border); color:var(--text-muted); font-size:0.8em;">
    對立詞學習法：先各自學會、再做 contrastive review 強化記憶。
    <br>
    有想法？ <a href="mailto:jack@ootob.ai?subject=Pairs%20feedback" style="color:var(--text-muted); text-decoration:underline;">寄信給 jack@ootob.ai</a>
  </footer>
</div>

<div class="spotlight-overlay" id="spotlightOverlay" onclick="closeSpotlight(event)">
  <div style="position:relative;">
    <button class="spotlight-close" onclick="closeSpotlight()">關閉 ✕</button>
    <div id="spotlightCard"></div>
  </div>
</div>

<script>
const CATEGORY_LABELS = {
  size: '尺寸', weight: '重量', temp: '溫度',
  value: '價格/評價', age: '新舊', speed: '速度/時間',
  distance: '距離', difficulty: '難易', quantity: '數量',
  strength: '強度', brightness: '明暗', emotion: '情緒',
  taste: '味道', personality: '性質', color: '顏色'
};

let allPairs = [];
let activeCat = 'all';
let activeLevel = 'all';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function parsePairsMd(text) {
  const lines = text.split('\n');
  const pairs = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('格式') || trimmed.startsWith('例句中文模板')) continue;
    const parts = trimmed.split('|').map(s => s.trim());
    if (parts.length >= 11) {
      pairs.push({
        cat: parts[0],
        aKanji: parts[1], aKana: parts[2], aZh: parts[3],
        bKanji: parts[4], bKana: parts[5], bZh: parts[6],
        aJa: parts[7], bJa: parts[8],
        zhTemplate: parts[9],
        level: parts[10]
      });
    }
  }
  return pairs;
}

function rubify(ja, kanji, kana) {
  if (!ja || !kanji || !kana) return escapeHtml(ja);
  const m = kanji.match(/^([一-鿿]+)/);
  if (m && ja.includes(kanji)) {
    const kanjiPart = m[1];
    const okurigana = kanji.slice(kanjiPart.length);
    const kanaReading = kana.endsWith(okurigana) ? kana.slice(0, kana.length - okurigana.length) : kana;
    const safeKanjiPart = escapeHtml(kanjiPart);
    const safeKanaReading = escapeHtml(kanaReading);
    const safeOkurigana = escapeHtml(okurigana);
    const replacement = `<ruby>${safeKanjiPart}<rt>${safeKanaReading}</rt></ruby>${safeOkurigana}`;
    return escapeHtml(ja).split(escapeHtml(kanji)).join(replacement);
  }
  return escapeHtml(ja);
}

function renderWordHtml(kanji, kana, zh, side) {
  const m = kanji.match(/^([一-鿿]+)/);
  let kanjiHtml;
  if (m) {
    const kanjiPart = m[1];
    const okurigana = kanji.slice(kanjiPart.length);
    const kanaReading = kana.endsWith(okurigana) ? kana.slice(0, kana.length - okurigana.length) : kana;
    kanjiHtml = `<ruby>${escapeHtml(kanjiPart)}<rt>${escapeHtml(kanaReading)}</rt></ruby>${escapeHtml(okurigana)}`;
  } else {
    kanjiHtml = escapeHtml(kanji);
  }
  return `<div class="word ${side}"><div class="kanji">${kanjiHtml}</div><div class="zh">${escapeHtml(zh)}</div></div>`;
}

function buildZhSentence(template, side, aZh, bZh) {
  const word = side === 'a' ? aZh : bZh;
  return template
    .replace(/\{A\/B\}/g, word)
    .replace(/\{A\}/g, side === 'a' ? aZh : '')
    .replace(/\{B\}/g, side === 'b' ? bZh : '');
}

function renderPairCardHtml(p) {
  const aJa = rubify(p.aJa, p.aKanji, p.aKana);
  const bJa = rubify(p.bJa, p.bKanji, p.bKana);
  const aZhSentence = escapeHtml(buildZhSentence(p.zhTemplate, 'a', p.aZh, p.bZh));
  const bZhSentence = escapeHtml(buildZhSentence(p.zhTemplate, 'b', p.aZh, p.bZh));
  const catLabel = CATEGORY_LABELS[p.cat] || p.cat;

  return `
    <div class="pair-card">
      <div class="level-tag">${escapeHtml(p.level)}</div>
      <div class="cat-tag">${escapeHtml(catLabel)}</div>
      <div class="pair-words">
        ${renderWordHtml(p.aKanji, p.aKana, p.aZh, 'a')}
        <div class="vs">vs</div>
        ${renderWordHtml(p.bKanji, p.bKana, p.bZh, 'b')}
      </div>
      <div class="examples">
        <div class="example a">
          <div class="ja">${aJa}</div>
          <div class="zh">${aZhSentence}</div>
        </div>
        <div class="example b">
          <div class="ja">${bJa}</div>
          <div class="zh">${bZhSentence}</div>
        </div>
      </div>
    </div>`;
}

function getFiltered() {
  return allPairs.filter(p => {
    if (activeCat !== 'all' && p.cat !== activeCat) return false;
    if (activeLevel !== 'all' && p.level !== activeLevel) return false;
    return true;
  });
}

function render() {
  const list = getFiltered();
  const container = document.getElementById('pairList');
  const empty = document.getElementById('empty');
  const count = document.getElementById('countBar');

  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `${list.length} 組`;
  container.innerHTML = list.map(renderPairCardHtml).join('');
}

function renderCatFilter() {
  const cats = [...new Set(allPairs.map(p => p.cat))];
  const wrap = document.getElementById('catFilter');
  const buttons = cats.map(c => {
    const label = CATEGORY_LABELS[c] || c;
    return `<button class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</button>`;
  }).join('');
  wrap.innerHTML = `<button class="chip active" data-cat="all">全部</button>` + buttons;
  wrap.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      wrap.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });
}

function setLevel(lv) {
  activeLevel = lv;
  document.querySelectorAll('[data-level]').forEach(b => {
    b.classList.toggle('active', b.dataset.level === lv);
  });
  render();
}

function toggleHide() {
  const hz = document.getElementById('hideZh').checked;
  const hj = document.getElementById('hideJa').checked;
  document.body.classList.toggle('hide-zh', hz);
  document.body.classList.toggle('hide-ja', hj);
}

function randomSpotlight() {
  const list = getFiltered();
  if (!list.length) return;
  const p = list[Math.floor(Math.random() * list.length)];
  const card = document.getElementById('spotlightCard');
  card.innerHTML = renderPairCardHtml(p);
  if (card.firstElementChild) card.firstElementChild.classList.add('spotlight');
  document.getElementById('spotlightOverlay').classList.add('show');
}

function closeSpotlight(e) {
  if (e && e.target.closest('.pair-card')) return;
  document.getElementById('spotlightOverlay').classList.remove('show');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSpotlight();
  if (e.key === ' ' && !e.target.matches('input,textarea')) {
    e.preventDefault();
    randomSpotlight();
  }
});

async function init() {
  try {
    const res = await fetch('adjective-pairs.md');
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    allPairs = parsePairsMd(text);
    renderCatFilter();
    render();
  } catch (err) {
    document.getElementById('filePicker').style.display = 'block';
  }
}

function handleFileSelect() {
  const input = document.getElementById('pairsFile');
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    allPairs = parsePairsMd(e.target.result);
    document.getElementById('filePicker').style.display = 'none';
    renderCatFilter();
    render();
  };
  reader.readAsText(input.files[0]);
}

init();
</script>
</body>
</html>
